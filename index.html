<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Expense & Budget Tracker</h2>

        <!-- Balance Overview Card -->
        <div class="balance-card">
            <span class="label">YOUR CURRENT BALANCE</span>
            <h1 id="total-balance">$0.00</h1>
            <div class="summary-row">
                <div class="summary-box income">
                    <span>INCOME</span>
                    <h3 id="total-income">+$0.00</h3>
                </div>
                <div class="summary-box expense">
                    <span>EXPENSE</span>
                    <h3 id="total-expense">-$0.00</h3>
                </div>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="form-section">
            <h3>Add New Transaction</h3>
            <div class="form-control">
                <input type="text" id="desc-input" placeholder="Description (e.g., Salary, Coffee)..." />
            </div>
            <div class="form-row">
                <input type="number" id="amount-input" placeholder="Amount (e.g., 50)" step="0.01" />
                <select id="type-select">
                    <option value="income">Income (+)</option>
                    <option value="expense">Expense (-)</option>
                </select>
                <button id="add-trans-btn">Add</button>
            </div>
        </div>

        <!-- Filter Buttons -->
        <div class="filter-bar">
            <button class="filter-tab active" data-type="all">All</button>
            <button class="filter-tab" data-type="income">Income Only</button>
            <button class="filter-tab" data-type="expense">Expenses Only</button>
        </div>

        <!-- Transaction List -->
        <ul id="transaction-list">
            <!-- Transactions will appear here -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
